# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow search engines (Bing, Yandex, ...) about the site's pages after each deploy. The key file
  # 6b25166cbd7695c8d33692e1cc70948a.txt at the site root proves ownership. Failures here never affect the deploy.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 30
          urls=$(curl -fsSL https://qq456cvb.github.io/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | jq -R . | jq -s .)
          jq -n --argjson urls "$urls" '{host: "qq456cvb.github.io", key: "6b25166cbd7695c8d33692e1cc70948a", keyLocation: "https://qq456cvb.github.io/6b25166cbd7695c8d33692e1cc70948a.txt", urlList: $urls}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) URLs"
          curl -sS -o response.txt -w 'IndexNow HTTP %{http_code}\n' -H "Content-Type: application/json; charset=utf-8" --data @body.json https://api.indexnow.org/indexnow
          cat response.txt || true
