<section class="home-section visitor-globe" id="visitor-globe" aria-labelledby="visitors">
  <h2 class="home-section__title" id="visitors">Visitors</h2>
  <div class="home-section__body">
    <div class="visitor-globe__slot" id="visitor-globe-slot" role="img" aria-label="Globe with a dot for each place this site has been visited from"></div>
  </div>
  <script>
    (function () {
      /* MapMyVisitors globe (site.visitor_globe) at the end of the home page. The widget script is added once the page
         is parsed (it must still load before the window load event, which starts its animation) and the section stays
         collapsed until the globe is drawn, so an ad blocker or a wrong token leaves nothing behind. */
      var box = document.getElementById('visitor-globe'), slot = document.getElementById('visitor-globe-slot');
      function start() {
        var s = document.createElement('script'), tries = 0, timer;
        s.id = 'mmvst_globe';
        s.src = 'https://mapmyvisitors.com/globe.js?d={{ site.visitor_globe | url_encode }}';
        slot.appendChild(s);
        timer = setInterval(function () {
          var g = slot.querySelector('.mmvst_outer');
          if (g && g.offsetHeight) { clearInterval(timer); box.classList.add('is-ready'); }
          else if (++tries > 600) { clearInterval(timer); }
        }, 100);
      }
      if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start); } else { start(); }
    })();
  </script>
</section>
