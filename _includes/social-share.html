{% include base_path %}
{% assign share_url = page.url | prepend: site.url | cgi_escape %}
{% assign share_title = page.title | strip_html | cgi_escape %}
<section class="page__share">
  <span class="page__share-title">{{ site.data.ui-text[site.locale].share_on_label | default: "Share on" }}</span>
  <a href="https://twitter.com/intent/tweet?url={{ share_url }}&amp;text={{ share_title }}">X</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}">LinkedIn</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}">Facebook</a>
</section>
